<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz do Nosso Amor ❤️</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffe6ee;
            text-align: center;
            padding: 20px;
            color: #d81b60;
        }
        .container {
            background: white;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(216, 27, 96, 0.2);
        }
        button {
            background: #e91e63;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 10px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            background: #c2185b;
            transform: scale(1.05);
        }
        .option {
            background: #fce4ec;
            padding: 12px;
            margin: 8px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
        }
        .option:hover {
            background: #f8bbd0;
        }
        .hidden { display: none; }
        #result { 
            font-size: 24px; 
            margin: 20px 0;
            line-height: 1.5;
        }
        .emoji {
            font-size: 20px;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="start-screen">
            <h1>Quiz do Nosso Amor ❤️</h1>
            <p>Teste o quanto você me conhece!</p>
            <button id="start-btn">Começar</button>
        </div>

        <div id="quiz-screen" class="hidden">
            <h2 id="question"></h2>
            <div id="options"></div>
            <button id="next-btn" class="hidden">Próxima</button>
        </div>

        <div id="result-screen" class="hidden">
            <h1>Resultado</h1>
            <div id="result"></div>
            <button id="restart-btn">Jogar Novamente</button>
        </div>
    </div>

    <script>
        const questions = [
            { 
                question: "1. Quando foi o nosso primeiro beijo?", 
                options: {
                    "A": "em uma janta",
                    "B": "no colégio",
                    "C": "em uma festa",
                    "D": "após o 5° encontro"
                },
                correct: "B" // Resposta correta é B
            },
            { 
                question: "2. Qual foi o primeiro presente que eu te dei?", 
                options: {
                    "A": "Um chocolate",
                    "B": "Uma blusa",
                    "C": "Um acessório",
                    "D": "Um perfume"
                },
                correct: "C" // Resposta correta é C
            },
            { 
                question: "3. O que eu mais gosto em você?", 
                options: {
                    "A": "Seu sorriso",
                    "B": "Seu jeito carinhoso",
                    "C": "Sua inteligência",
                    "D": "Todas as alternativas acima"
                },
                correct: "D" // Resposta correta é D
            },
            { 
                question: "4. Se tivermos uma viagem dos sonhos, para onde seria?", 
                options: {
                    "A": "Maldivas 🌴",
                    "B": "Paris 🇫🇷",
                    "C": "Japão 🇯🇵",
                    "D": "Nova York 🗽"
                },
                correct: "D" // Resposta correta é D
            },
            { 
                question: "5. Quem é mais provável de esquecer o aniversário de namoro?", 
                options: {
                    "A": "Eu 😅",
                    "B": "Você 😬",
                    "C": "Nenhum dos dois ❤️",
                    "D": "Ambos 😜"
                },
                correct: "C" // Resposta correta é C
            },
            { 
                question: "6. Qual é o apelido que mais gosto que você me chama?", 
                options: {
                    "A": "Amor",
                    "B": "Princeso",
                    "C": "Neném",
                    "D": "Vida"
                },
                correct: "B" // Resposta correta é B
            },
            { 
                question: "7. Qual é meu maior talento escondido?", 
                options: {
                    "A": "Cantar 🎤",
                    "B": "Cozinhar 🍳",
                    "C": "Dançar 💃",
                    "D": "Contar piadas ruins 😂"
                },
                correct: "B" // Resposta correta é B
            },
            { 
                question: "8. Quando estou bravo(a), eu geralmente:", 
                options: {
                    "A": "Fico em silêncio 😐",
                    "B": "Respondo curto 🤬",
                    "C": "Choro 😭",
                    "D": "Vou dormir pra esquecer 😴"
                },
                correct: "A" // Resposta correta é A
            },
            { 
                question: "9. Qual é a minha maior mania?", 
                options: {
                    "A": "Roer as unhas 💇‍♀️",
                    "B": "Rir em momentos sérios 😂",
                    "C": "Organizar tudo 📚",
                    "D": "Falar sozinho(a) 🗣️"
                },
                correct: "A" // Resposta correta é A
            },
            { 
                question: "10. Quando eu estou triste, o que mais me anima?", 
                options: {
                    "A": "Chocolate 🍫",
                    "B": "Sua companhia 🫂",
                    "C": "Música 🎶",
                    "D": "Filmes engraçados 🎥"
                },
                correct: "B" // Resposta correta é B
            },
            { 
                question: "11. Qual presente me faria mais feliz?", 
                options: {
                    "A": "Uma carta escrita à mão 💌",
                    "B": "Uma viagem surpresa 🌍",
                    "C": "Um jantar especial 🍷",
                    "D": "Um dia inteiro só nosso ❤️"
                },
                correct: "D" // Resposta correta é D
            },
            { 
                question: "12. Em uma palavra, como eu descreveria nosso amor?", 
                options: {
                    "A": "Verdadeiro",
                    "B": "Intenso",
                    "C": "Inesquecível",
                    "D": "Inefável"
                },
                correct: "D" // Resposta correta é D
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const questionElement = document.getElementById('question');
        const optionsElement = document.getElementById('options');
        const resultElement = document.getElementById('result');
        const nextBtn = document.getElementById('next-btn');

        document.getElementById('start-btn').addEventListener('click', startQuiz);
        document.getElementById('restart-btn').addEventListener('click', restartQuiz);
        nextBtn.addEventListener('click', nextQuestion);

        function startQuiz() {
            startScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            const q = questions[currentQuestion];
            questionElement.textContent = q.question;
            optionsElement.innerHTML = '';
            
            // Mostra sempre na ordem A, B, C, D
            for (const [key, value] of Object.entries(q.options)) {
                const div = document.createElement('div');
                div.className = 'option';
                div.textContent = `${key}) ${value}`;
                div.dataset.option = key;
                div.addEventListener('click', () => selectAnswer(key));
                optionsElement.appendChild(div);
            }
            
            nextBtn.classList.add('hidden');
        }

        function selectAnswer(selectedOption) {
            const options = document.querySelectorAll('.option');
            const correctOption = questions[currentQuestion].correct;
            
            options.forEach(option => {
                option.style.pointerEvents = 'none';
                
                if (option.dataset.option === correctOption) {
                    option.style.background = '#a5d6a7';
                }
                
                if (option.dataset.option === selectedOption && selectedOption !== correctOption) {
                    option.style.background = '#ef9a9a';
                }
            });
            
            if (selectedOption === correctOption) {
                score++;
            }
            
            nextBtn.classList.remove('hidden');
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            const percentage = Math.round((score / questions.length) * 100);
            
            if (percentage >= 90) {
                resultElement.innerHTML = `Você acertou ${score} de ${questions.length}!<br><br>Você me conhece PERFEITAMENTE! ❤️<br>Nosso amor é realmente especial!`;
            } else if (percentage >= 70) {
                resultElement.innerHTML = `Você acertou ${score} de ${questions.length}!<br><br>Você me conhece muito bem! 😊<br>Mas ainda temos muito para descobrir juntos!`;
            } else {
                resultElement.innerHTML = `Você acertou ${score} de ${questions.length}!<br><br>Precisamos nos conhecer melhor! 💕<br>Que tal mais tempo juntos?`;
            }
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            resultScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
        }
    </script>
</body>
</html>
